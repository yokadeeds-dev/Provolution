name: data-consistency

# Probatio Consistentia v0.2 — blockiert bei Drift in den SSoT-YAMLs
# (Aggregate, Zähler, Cross-File-Sync, GWP AR6, SEC-J, Quellen).
# Heuristische Checks 1/3/4 laufen mit, sind im --ci-Modus aber nur Hinweise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml==6.0.2
      - name: Spec-consistency audit (CI mode)
        run: python _tools/spec_consistency_audit.py --ci
      - name: Placeholder sources resolve
        run: python _tools/build_impact_references.py --validate
