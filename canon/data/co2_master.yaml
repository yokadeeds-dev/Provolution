# CO₂-Bilanz Master Data - Single Source of Truth (CO2-spezifisch)
# Provolution Framework - Hebel-Katalog (A-J) + Community-Integrations
# Version: 1.0
# Datum: 2026-01-24
# Alle Werte in Gt CO₂eq/Jahr (negativ = Reduktion/Senke)
#
# Kanonische Hebel-Liste (alle 43 Hebel inkl. Stubs + Communities):
#   06_CANON/HEBEL_KATALOG_v1.0.md
# Diese YAML-Datei ist Subset davon (n=35 = 34 A-J + 1 Community
# mit quantifizierter CO2-Wirkung).

meta:
  version: "1.1"
  last_updated: "2026-01-24"
  description: "Zentrale CO₂-Bilanz aller Provolution-Hebel + Community-Integrations"
  source: "Band 5, Kapitel 5.5 - Gesamtbilanz"
  
# Wissenschaftliche Methodologie (für Peer Review)
methodology:
  reference_standards:
    - name: "GHG Protocol Corporate Accounting and Reporting Standard"
      version: "Revised Edition"
      year: 2015
      url: "https://ghgprotocol.org/corporate-standard"
      application: "Scope 1/2/3 Definition, System Boundaries, Double Counting Prevention"
    
    - name: "IPCC AR6 Working Group III"
      version: "Chapter 2 & 3"
      year: 2022
      url: "https://www.ipcc.ch/report/ar6/wg3/"
      application: "Emission Factors, Uncertainty Assessment, AFOLU Guidelines"
    
    - name: "ISO 14064-1:2018"
      version: "2018"
      url: "https://www.iso.org/standard/66453.html"
      application: "Organizational GHG Inventory Specification"
  
  scope_definitions:
    scope_1: "Direct GHG emissions from owned/controlled sources"
    scope_2: "Indirect emissions from purchased electricity, heat, steam"
    scope_3: "All other indirect emissions in value chain (selected categories)"
    scope_application: "Provolution addresses all 3 scopes across 10 domains (A-J)"
  
  emission_factors:
    electricity_grid_de:
      value: 0.485  # kg CO₂eq/kWh
      source: "Umweltbundesamt (UBA) 2023"
      uncertainty: [0.450, 0.520]  # 95% Confidence Interval
      scope: "Scope 2"
    
    transport_diesel:
      value: 2.68  # kg CO₂eq/liter
      source: "IPCC AR6 Table 2.3"
      uncertainty: [2.50, 2.85]
      scope: "Scope 1"
    
    natural_gas:
      value: 0.202  # kg CO₂eq/kWh
      source: "IPCC AR6 Default Values"
      uncertainty: [0.190, 0.215]
      scope: "Scope 1"
    
    soil_carbon_sequestration:
      value: -0.5  # t CO₂eq/ha/year (regenerative agriculture)
      source: "IPCC AR6 AFOLU Chapter"
      uncertainty: [-0.8, -0.3]
      scope: "Removal/Sink"
    
    biomass_growth_hemp:
      value: -15.0  # t CO₂eq/ha/year (gross uptake)
      source: "Carus et al. 2013, nova-Institute"
      uncertainty: [-20.0, -12.0]
      scope: "Removal (with carbon storage in products)"
  
  system_boundaries:
    temporal: "Annual accounting (2025-2050)"
    spatial: "Global potential, regional implementation"
    organizational: "Multi-stakeholder (public, private, civil society)"
    value_chain: "Cradle-to-grave where applicable, cradle-to-gate for intermediate products"
  
  double_counting_prevention:
    method: "Hierarchical domain allocation with overlap matrices"
    example_b_production: "B07 (Circular Economy) gross potential -23 Gt is reduced to -15.8 Gt domain total after removing overlaps with B08-B12"
    verification: "Cross-reference matrix in Band 5, Chapter 5.5"
    baseline_consistency: "Common baseline scenario (BAU 2023) for all applications"
  
  uncertainty_assessment:
    approach: "Monte Carlo simulation with triangular distributions"
    confidence_level: "95% (5th-95th percentile)"
    key_parameters:
      - "Emission factors (±10-20%)"
      - "Activity data (±5-15%)"
      - "Baseline projections (±20-30%)"
      - "Implementation rates (±30-50%)"
    
    propagation: "Total uncertainty ~±25% on aggregate CO₂ balance"
    conservative_bias: "Lower bounds used for reduction potentials"
  
  calculation_methodology:
    emissions: "Activity Data × Emission Factor × GWP (for CH₄, N₂O)"
    avoidance: "Baseline Emissions - Intervention Emissions (same functional unit)"
    removals: "Net carbon sequestration accounting for permanence and leakage"
    aggregation: "Domain-level sums with overlap adjustments → Total balance"
  
  data_quality_tiers:
    tier_1: "IPCC default factors (lowest specificity)"
    tier_2: "National/regional factors (medium specificity)"  
    tier_3: "Direct measurement/LCA data (highest specificity)"
    provolution_target: "Minimum Tier 2, Tier 3 for key applications (B07, C11, D15-17)"
  
  validation_approach:
    internal: "SEC-Score correlation with CO₂ impact (r=0.94)"
    external: "Comparison with sectoral deep-dive studies (IEA, McKinsey, Project Drawdown)"
    sensitivity: "Key parameter variation ±20% changes total by <±15%"
    plausibility: "Total -57.0 Gt/year = 104% of global emissions (55 Gt baseline) = Net Negative; physically consistent via active sequestration (D16 Boden-CO2-Senken -5 Gt)"

gesamt:
  reduktion_hart: -58.0  # Harte, verifizierbare Emissionsreduktionen — n=40 (Basis 30 Apps -50.7 + I33/I34/J01 -4.3 + C-2026-008 PF+Hanf -3.0)
  vermeidung_weich: -28.5  # Vermiedene/verhinderte Emissionen
  total_potenzial: -85.5  # Summe aller Potenziale
  anteil_global_emissions: 1.04  # 104% der globalen Emissionen (55 Gt Baseline) = Net Negative
  korrelation_theorie_praxis: 0.94  # Mathematische Validierung
  
