# Formel STANDARD: SEC-J(m) = 0,30·S + 0,25·E + 0,30·C + 0,15·J
# Formel JUSTICE:  SEC-J(m, justice) = 0,25·S + 0,15·E + 0,20·C + 0,40·J
# J-Veto: J<0,50 → SEC-J = null (absolutes Veto)
# J-Flag SOZIALE INKONSISTENZ: J<0,40 → Pflicht-Hinweis + Empfehlung
# J-Warnschwelle: J<0,80 → Implementierungs-Auflagen erforderlich
# DEPRECATED: SECJ_SPEC v1.0 Formel war 0.40·S + 0.25·E + 0.15·C + 0.20·J — siehe canon/de/SECJ_SPEC_v1.0.md Deprecation-Markierung

